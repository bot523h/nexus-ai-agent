# Deploy shape validated by `python scripts/deploy_smoke.py` (task-130).
# Runbook: docs/ops/DEPLOY_RUNBOOK.md
name: nexus-ai
services:
  - name: bot
    # v3.8.0 (Phase 3): "web" instead of "worker" so the service can scale
    # to zero. Telegram POSTs updates to POST /webhook/telegram; liveness
    # is answered by GET /healthz (no database touch).
    type: web
    docker:
      dockerfile: Dockerfile
    env:
      - name: TELEGRAM_BOT_TOKEN
        value: "{{ .Env.TELEGRAM_BOT_TOKEN }}"
      - name: GEMINI_API_KEY
        value: "{{ .Env.GEMINI_API_KEY }}"
      - name: NEXUS_RUN_MODE
        value: "webhook"
      - name: NEXUS_WEBHOOK_URL
        value: "{{ .Env.NEXUS_WEBHOOK_URL }}"
      - name: NEXUS_WEBHOOK_SECRET
        value: "{{ .Env.NEXUS_WEBHOOK_SECRET }}"
    health_check:
      path: /healthz
