[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-agent"
version = "3.13.0"
description = "NEXUS AI agent: offline-first multi-agent orchestration with Telegram integration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NEXUS AI" }]
dependencies = [
  "python-telegram-bot>=21.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite==3.1.1",
  "sqlmodel==0.0.42",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "aiosqlite==0.22.1",
  "asyncpg==0.31.0",
  "psycopg[binary,pool]==3.3.5",
  "langgraph-checkpoint-postgres==3.1.2",
  "pydantic-settings>=2.0",
  "pydantic>=2.7,<3",  # imported directly by 29 modules (audit A-05); was only transitive
    "sentence-transformers>=3.0",
    "llama-cpp-python>=0.2",
    "llama-index-core==0.14.25",  # task-273: knowledge retrieval adapter (MIT, pinned 2026-10-23)
    "structlog>=24.0",
    "sqlite-vec>=0.1",
    "typer>=0.12",
    "httpx==0.28.1",  # pinned: core/ssrf_guard.py uses a private httpx API
    "python-multipart>=0.0.9",
    "duckduckgo-search>=8.0",
    "fastapi>=0.110",
    "uvicorn==0.53.0",  # pinned: webhook run-mode server (v3.8.0, verified latest on PyPI)
    "numpy>=1.26",
    "chromadb>=0.5",
    "flashrank>=0.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "psutil>=5.9",
    "litellm>=1.74,<2",  # multi-provider routing chain (Ollama/Groq/Gemini/OpenRouter)
    "boto3==1.43.98",  # pinned: Cloudflare R2 blob tier (v3.9.0, latest on PyPI 2026-09-20)
  ]

[project.scripts]
nexus = "nexus_ai_agent.cli:app"

[project.optional-dependencies]
pdf = [
  "pypdf>=5.1",  # D3: real PDF text extraction (clear error when missing)
]
speech = [
  "faster-whisper>=1.0,<2",  # Wave 9: local CTranslate2 ASR (int8 CPU, no torch)
]
translate = [
  "argostranslate>=1.9,<2",  # Wave 9: fully-offline neural translation (incl. Persian)
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pypdf>=5.1",  # keep the pdf-extraction test path real, not mocked
  "imageio-ffmpeg>=0.5",  # bundles a static FFmpeg: the render test runs a real encode
  "deptry>=0.20",  # declared-vs-imported dependency gate (`make deps`, CI lint job)
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus_ai_agent.creative.packs.caption" = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow", "integration: requires an external service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "llama_cpp",
    "gtts",
    "sentence_transformers",
    "langgraph",
    "langgraph.checkpoint.sqlite",
    "langgraph.checkpoint.postgres",
    "langgraph.checkpoint.postgres.aio",
    "psycopg",
    "psycopg_pool",
    "asyncpg",
    "mega",
    "sqlite_vec",
    "telegram",
    "telegram.ext",
    "chromadb",
    "flashrank",
    "arabic_reshaper",
    "bidi.algorithm",
    "boto3",
    "botocore",
    "botocore.config",
    "nacl",
    "nacl.signing",
    "nacl.exceptions",
]
ignore_missing_imports = true

# ── Dependency truth (audit A-05, 2026-10-15) ────────────────────────────────
# `deptry src` is part of `make lint` and the CI lint job: every import must be
# a declared dependency, and every declared runtime dependency must be used.
[tool.deptry]
known_first_party = ["nexus_ai_agent"]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# DEP001 — imported but not declared: *optional* integrations that are probed
# at import time and degrade with a typed error when absent.
#   nacl  → creative/packs/delivery/signing.py (Ed25519 backend; pure fallback)
#   gtts  → features/speech.py (online TTS; returns success=False when missing)
#   mega  → storage/providers/mega.py (ProviderUnavailable when missing)
DEP001 = ["nacl", "gtts", "mega"]
# DEP004 — imported at runtime but declared only in the dev extra: the bundled
# static FFmpeg is the *last* fallback of creative/slideshow/ffmpeg.py (after
# NEXUS_FFMPEG_BIN and PATH) and fails with a typed error when absent.
DEP004 = ["imageio_ffmpeg"]
# DEP002 — declared but not imported by name: database drivers selected through
# URL schemes / dialect strings, FastAPI's form parser, and the dynamic
# `duckduckgo_search` import in integrations/external.py.
DEP002 = ["asyncpg", "python-multipart", "duckduckgo-search"]
# DEP003 — transitive packages imported directly, each owned by a declared
# dependency: starlette (fastapi), httpcore (httpx), botocore (boto3),
# psycopg_pool (psycopg[pool]).
DEP003 = ["starlette", "httpcore", "botocore", "psycopg_pool"]
