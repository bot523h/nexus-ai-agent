[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-agent"
version = "3.10.0"
description = "NEXUS AI agent: offline-first multi-agent orchestration with Telegram integration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NEXUS AI" }]
dependencies = [
  "python-telegram-bot>=21.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=1.0",
  "langchain-community>=0.2",
  "sqlmodel==0.0.42",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "aiosqlite==0.22.1",
  "asyncpg==0.31.0",
  "psycopg[binary,pool]==3.3.5",
  "langgraph-checkpoint-postgres==3.1.2",
  "pydantic-settings>=2.0",
    "sentence-transformers>=3.0",
    "llama-cpp-python>=0.2",
    "structlog>=24.0",
    "sqlite-vec>=0.1",
    "typer>=0.12",
    "httpx==0.28.1",  # pinned: core/ssrf_guard.py uses a private httpx API
    "python-multipart>=0.0.9",
    "duckduckgo-search>=8.0",
    "fastapi>=0.110",
    "uvicorn==0.53.0",  # pinned: webhook run-mode server (v3.8.0, verified latest on PyPI)
    "numpy>=1.26",
    "chromadb>=0.5",
    "flashrank>=0.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
    "psutil>=5.9",
    "litellm>=1.74,<2",  # multi-provider routing chain (Ollama/Groq/Gemini/OpenRouter)
    "boto3==1.43.98",  # pinned: Cloudflare R2 blob tier (v3.9.0, latest on PyPI 2026-09-20)
  ]

[project.scripts]
nexus = "nexus_ai_agent.cli:app"

[project.optional-dependencies]
pdf = [
  "pypdf>=5.1",  # D3: real PDF text extraction (clear error when missing)
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest-mock>=3.12",
  "pypdf>=5.1",  # keep the pdf-extraction test path real, not mocked
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow", "integration: requires an external service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "llama_cpp",
    "gtts",
    "sentence_transformers",
    "langgraph",
    "langgraph.checkpoint.sqlite",
    "langgraph.checkpoint.postgres",
    "langgraph.checkpoint.postgres.aio",
    "psycopg",
    "psycopg_pool",
    "asyncpg",
    "langchain_community",
    "mega",
    "sqlite_vec",
    "telegram",
    "telegram.ext",
    "chromadb",
    "flashrank",
    "arabic_reshaper",
    "bidi.algorithm",
    "boto3",
    "botocore",
    "botocore.config",
]
ignore_missing_imports = true
