[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-agent"
version = "3.13.0"
description = "NEXUS AI agent: offline-first multi-agent orchestration with Telegram integration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NEXUS AI" }]
dependencies = [
  "python-telegram-bot>=21.0",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite==3.1.2",
  "sqlmodel==0.0.42",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "aiosqlite==0.22.1",
  "asyncpg==0.31.0",
  "psycopg[binary,pool]==3.3.5",
  "langgraph-checkpoint-postgres==3.1.3",
  "pydantic-settings>=2.0",
  "pydantic>=2.7,<3",  # imported directly by 29 modules (audit A-05); was only transitive
    "sentence-transformers>=3.0",
    "llama-cpp-python>=0.2",
    "llama-index-core==0.14.25",  # task-273: knowledge retrieval adapter (MIT, pinned 2026-10-23)
    "structlog>=24.0",
    "sqlite-vec>=0.1",
    "typer>=0.12",
    "httpx==0.28.1",  # pinned: core/ssrf_guard.py uses a private httpx API
    "python-multipart>=0.0.9",
    "duckduckgo-search>=8.0",
    "fastapi>=0.110",
    "uvicorn==0.53.0",  # pinned: webhook run-mode server (v3.8.0, verified latest on PyPI)
    "numpy>=1.26",
    "chromadb>=0.5",
    "flashrank>=0.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
    "pillow>=10.0",
    "av>=14,<19",  # Wave 4/14: post-disk PyAV verification of media artifacts (spine)
    "beautifulsoup4>=4.12",
    # Security floor for beautifulsoup4's CSS-selector engine (transitive, but
    # declared so the floor is enforced rather than hoped for): CVE-2026-126190
    # (fixed 4.0.0) and CVE-2026-126191 / CVE-2026-126193 (fixed 3.0.2).
    # Conditional on purpose: every patched release declares
    # `Requires-Python >=3.11.5`, so on an interpreter older than that no fixed
    # build exists to install — the marker keeps 3.10 installable instead of
    # turning the floor into a resolver failure (see docs/audits §8.4).
    #
    # `python_full_version`, NOT `python_version`: PEP 508 defines
    # `python_version` as `major.minor` only, so `python_version >= '3.11.5'`
    # compares "3.11" against "3.11.5" and is FALSE on every 3.11 interpreter —
    # the floor silently never applied. `python_full_version` carries the patch
    # level, so 3.11.5+ gets the fix and 3.11.0–3.11.4 (which cannot install it)
    # stays resolvable. `scripts/dependency_audit.py` now parses this line and
    # evaluates the marker itself, so this class of typo fails the gate.
    "soupsieve>=4.1.1; python_full_version >= '3.11.5'",
    "psutil>=5.9",
    "litellm>=1.74,<2",  # multi-provider routing chain (Ollama/Groq/Gemini/OpenRouter)
    "boto3==1.43.98",  # pinned: Cloudflare R2 blob tier (v3.9.0, latest on PyPI 2026-09-20)
    # Wave 4 (PR #333/#334): RFC 8785 canonicalization authority and the
    # AES-GCM credential envelopes of NAGAR CONNECT. No hand-rolled primitives
    # and no second key ladder: the libraries are the crypto/canonicalization
    # authority, imported lazily where the fail-closed error must be typed.
    "rfc8785==0.1.4",
    # Cap widened 48 -> 51 (2026-11-14): 47.0.0 carries four unaccepted advisories
    # (PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf) whose fixes are 48.0.1/49.0.0/
    # 50.0.0, so a `<48` cap could never resolve to a clean release and reddened
    # `scripts/dependency_audit.py` on every run. Only the stable HMAC/AES-GCM
    # surface is used (connect/crypto.py).
    "cryptography>=43,<51",
  ]

[project.scripts]
nexus = "nexus_ai_agent.cli:app"

[project.optional-dependencies]
pdf = [
  "pypdf>=6.21.4",  # D3: real PDF text extraction (clear error when missing)
]
speech = [
  "faster-whisper>=1.0,<2",  # Wave 9: local CTranslate2 ASR (int8 CPU, no torch)
]
translate = [
  "argostranslate>=1.9,<2",  # Wave 9: fully-offline neural translation (incl. Persian)
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "pypdf>=6.21.4",  # keep the pdf-extraction test path real, not mocked
  "imageio-ffmpeg>=0.5",  # bundles a static FFmpeg: the render test runs a real encode
  "deptry>=0.20",  # declared-vs-imported dependency gate (`make deps`, CI lint job)
  "pip-audit>=2.7",  # known-vulnerability gate (`make audit`, CI dependency-audit job)
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus_ai_agent.creative.packs.caption" = ["fonts/*.ttf", "fonts/OFL.txt"]
"nexus_ai_agent.web" = ["static/*"]  # Studio PWA shell (Wave 4 / PR #328)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: marks tests as slow", "integration: requires an external service"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"scripts/task255_mutation_probes.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "llama_cpp",
    "gtts",
    "sentence_transformers",
    "langgraph",
    "langgraph.checkpoint.sqlite",
    "langgraph.checkpoint.postgres",
    "langgraph.checkpoint.postgres.aio",
    "psycopg",
    "psycopg_pool",
    "asyncpg",
    "mega",
    "sqlite_vec",
    "telegram",
    "telegram.ext",
    "chromadb",
    "flashrank",
    "arabic_reshaper",
    "bidi.algorithm",
    "boto3",
    "botocore",
    "botocore.config",
    "nacl",
    "nacl.signing",
    "nacl.exceptions",
    "langsmith",
]
ignore_missing_imports = true

# ── Dependency truth (audit A-05, 2026-10-15) ────────────────────────────────
# `deptry src` is part of `make lint` and the CI lint job: every import must be
# a declared dependency, and every declared runtime dependency must be used.
[tool.deptry]
# ``scripts/`` is deliberately not an installed namespace
# (tests/architecture/test_scripts_import_boundary.py): each file there is a thin
# CLI that may import its *sibling* helper modules by bare name, because a script
# is executed from the repository root.  Those helpers are first-party files, not
# distributions, so the two that are imported that way are declared here — the
# alternative (a distribution per helper) would ship operator tooling as product.
known_first_party = ["nexus_ai_agent", "security_mutation_support", "omega_media"]
pep621_dev_dependency_groups = ["dev"]
# llama-cpp-python's distribution name and its import name (`llama_cpp`) are not
# derivable from one another, so deptry needs the explicit mapping to see the
# optional local-LLM backend as "declared and used" rather than reported twice
# (DEP002 on the distribution, DEP001 on the module).
package_module_name_map = { "llama-cpp-python" = ["llama_cpp"] }

[tool.deptry.per_rule_ignores]
# DEP001 — imported but not declared: *optional* integrations that are probed
# at import time and degrade with a typed error when absent.
#   nacl  → creative/packs/delivery/signing.py (Ed25519 backend; pure fallback)
#   gtts  → features/speech.py (online TTS; returns success=False when missing)
#   mega  → storage/providers/mega.py (ProviderUnavailable when missing)
DEP001 = ["nacl", "gtts", "mega"]
# DEP004 — imported at runtime but declared only in the dev extra: the bundled
# static FFmpeg is the *last* fallback of creative/slideshow/ffmpeg.py (after
# NEXUS_FFMPEG_BIN and PATH) and fails with a typed error when absent.
DEP004 = ["imageio_ffmpeg"]
# DEP002 — declared but not imported by name: database drivers selected through
# URL schemes / dialect strings, FastAPI's form parser, the dynamic
# `duckduckgo_search` import in integrations/external.py, and the `langsmith`
# SDK, which `observability/tracing.py` probes with `importlib.util.find_spec`
# and never imports at module scope (importing it eagerly would defeat the
# fail-closed design).  langsmith arrives transitively via langgraph →
# langchain-core, so tracing needs no separate extra — the opt-in switch
# governs egress, not installation.
#   soupsieve → declared only as a *security floor* on beautifulsoup4's selector
#   engine (CVE-2026-126190 / -126191 / -126193). Nothing imports it directly;
#   the floor exists so the vulnerable 2.x builds cannot be resolved back in.
DEP002 = ["asyncpg", "python-multipart", "duckduckgo-search", "langsmith", "soupsieve"]
# DEP003 — transitive packages imported directly, each owned by a declared
# dependency: starlette (fastapi), httpcore (httpx), botocore (boto3),
# psycopg_pool (psycopg[pool]).
#   packaging / yaml / langsmith → `scripts/` only (pip-audit, kubernetes and
#   langchain-core respectively).  `deptry .` scans the whole tree; those CLIs are
#   never imported by the shipped package, so the libraries stay transitive and
#   the reason is recorded here instead of the paths being silently ignored.
DEP003 = [
    "starlette",
    "httpcore",
    "botocore",
    "psycopg_pool",
    "packaging",
    "yaml",
    "langsmith",
]
