# Pre-commit hook: pinned ruff version must match CI's ``pip install -e ".[dev]"``.
# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the same minor as dev extra (ruff>=0.4).  Renovate this
    # alongside pyproject.toml; CI and local hooks must agree.
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []  # mypy reads [tool.mypy] from pyproject.toml
        types: [python]
