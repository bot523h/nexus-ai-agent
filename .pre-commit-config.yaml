# Pre-commit hooks — one-command install:  make hooks
# Run on demand:  pre-commit run --all-files
#
# The ruff `rev` below is the repository's single pinned ruff version: it must equal the
# `ruff==` pin of the `lint-fast` job in .github/workflows/ci.yml, and pyproject.toml
# (`ruff>=0.4`) must still admit it.  Bump BOTH files in ONE commit —
# tests/unit/test_ci_lint_parity.py fails on any disagreement, because ruff's format
# output changes between minors ("green locally, red in CI").
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []  # mypy reads [tool.mypy] from pyproject.toml
        types: [python]
