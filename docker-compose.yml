version: '3.8'

# Modular monolith (R-001/R-026): background jobs (PDF indexing, story
# rendering) run in-process inside the bot service and persist their state
# to data/app.sqlite.jobs on the mounted volume.  There is no broker, no
# worker and no beat service.

services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    restart: always

  dashboard:
    build: .
    command: uvicorn nexus_ai_agent.api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
