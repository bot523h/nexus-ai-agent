# task-283 (review finding 5) — the queue-ownership / publication mutation campaign.
#
# `scripts/queue_ownership_mutations.py` existed but was never invoked by CI, so
# "every mutant killed" was a local-only claim.  This dedicated workflow makes it
# an enforced gate on every pull request that changes the queue/publication
# surface (and on any push to a protected line).
#
# Design notes (why this file exists instead of a job inside ci.yml): the queue
# job is deliberately narrow, so it can carry a much smaller budget than the
# repository-wide CI jobs, and `ci.yml` is owned by another active claim at the
# time of writing.  A dedicated file keeps the campaign independently
# attributable and reviewable.
#
# Properties the job must keep — each is asserted, not assumed:
#   * bounded: `timeout-minutes` caps the whole campaign;
#   * scoped: only the queue-ownership/publication files and node ids listed in
#     the harness are mutated, and the harness runs in a detached worktree so a
#     crash can never leave the job's checkout mutated;
#   * a surviving mutant fails the job (the harness exits non-zero, and the
#     report is asserted independently of the exit code);
#   * the exit code and the per-probe evidence are recorded and uploaded even
#     when the campaign fails.

name: queue-ownership-mutations

on:
  pull_request:
    paths:
      - "src/nexus_ai_agent/adapters/in_process_job_queue.py"
      - "src/nexus_ai_agent/creative/render_jobs.py"
      - "src/nexus_ai_agent/bot/webhook.py"
      - "src/nexus_ai_agent/bot/app.py"
      - "src/nexus_ai_agent/cli.py"
      - "src/nexus_ai_agent/execution/staging.py"
      - "scripts/queue_ownership_mutations.py"
      - "tests/integration/test_queue_ownership_*.py"
      - "tests/integration/test_artifact_publication_safety.py"
      - "tests/integration/test_publication_crash_recovery.py"
      - "tests/architecture/test_queue_ownership_startup_contract.py"
      - ".github/workflows/queue-ownership-mutations.yml"
  push:
    branches: [main]
    paths:
      - "src/nexus_ai_agent/adapters/in_process_job_queue.py"
      - "src/nexus_ai_agent/creative/render_jobs.py"
      - "src/nexus_ai_agent/bot/webhook.py"
      - "scripts/queue_ownership_mutations.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queue-ownership-mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  queue-ownership-mutations:
    name: queue-ownership-mutations (10 probes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: isolated worktree for the campaign
        run: |
          rm -rf ci-artifacts && mkdir -p ci-artifacts
          git worktree add --detach "$RUNNER_TEMP/queue-mutation-worktree" HEAD
      - name: run the campaign (the harness exit code is the verdict)
        working-directory: ${{ runner.temp }}/queue-mutation-worktree
        run: |
          set -o pipefail
          python scripts/queue_ownership_mutations.py \
            --report "$GITHUB_WORKSPACE/ci-artifacts/queue-ownership-mutations.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-artifacts/queue-ownership-mutations.log"
      - name: assert the recorded evidence, not only the exit code
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("ci-artifacts/queue-ownership-mutations.json")
          if not path.is_file():
              print("no campaign report was produced", file=sys.stderr)
              sys.exit(1)

          report = json.loads(path.read_text())
          expected = {
              "planned": 10,
              "executed": 10,
              "killed": 10,
              "survived": 0,
              "invalid": 0,
              "not_run": 0,
          }
          provenance = report.get("provenance", {})
          ok = (
              report.get("accepted") is True
              and report.get("summary") == expected
              and provenance.get("worktree_clean") is True
              and not report.get("failures")
          )
          print("queue-ownership mutation evidence:", report.get("summary"))
          print("tested commit:", provenance.get("git_commit"))
          print("interpreter:", provenance.get("interpreter"))
          print("target hashes:", json.dumps(provenance.get("target_hashes"), indent=2))
          sys.exit(0 if ok else 1)
          PY
      - name: the worktree and the checkout must be unchanged
        if: always()
        run: |
          git -C "$RUNNER_TEMP/queue-mutation-worktree" diff --exit-code || true
          git worktree remove --force "$RUNNER_TEMP/queue-mutation-worktree" || true
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        name: upload queue-ownership mutation evidence even on failure
        if: always()
        with:
          name: queue-ownership-mutations-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
