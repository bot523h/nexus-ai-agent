name: Publication frontier guard

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: publication-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-model:
    name: lease model + real-repository semantics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test harness only
        run: python -m pip install 'pytest>=8'
      - name: Board CLI + publication guard semantics
        run: |
          python -m pytest -q \
            tests/unit/test_agent_board.py \
            tests/unit/test_agent_board_remote.py

  pushed-range:
    name: pushed range vs remote leases (post-push alarm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && startsWith(github.ref_name, 'arena/')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify the entire pushed range against the live frontier
        # Full history is required: a shallow checkout cannot enumerate the
        # outgoing range, and the guard must refuse, not approximate.
        run: |
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            'refs/heads/arena/*:refs/remotes/origin/arena/*'
          python scripts/agent_board.py preflight \
            --branch "${{ github.ref_name }}" --remote origin
