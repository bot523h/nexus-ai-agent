name: REMOTE-KEY security mutation gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  remote-key-mutations:
    name: REMOTE-KEY ingress and cache-path mutations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Require ingress, decoding, traversal, and symlink mutants to be killed
        run: python scripts/security_mutations_remote_key.py
