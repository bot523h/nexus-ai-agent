name: Installed artifact contract

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: wheel-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-contract:
    name: wheel + runtime contracts (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the shipping wheel
        run: |
          python -m pip install 'build>=1.2,<2' 'setuptools>=69' wheel
          python -m build --wheel
      - name: Install wheel in a clean environment (never editable)
        run: |
          python -m venv /tmp/nexus-wheel-contract
          /tmp/nexus-wheel-contract/bin/python -m pip install --upgrade pip
          WHEEL=$(find "$PWD/dist" -name '*.whl' -print -quit)
          /tmp/nexus-wheel-contract/bin/python -m pip install "${WHEEL}[dev]" 'setuptools>=69' wheel
          /tmp/nexus-wheel-contract/bin/python -m pip check
      - name: Prove installed runtime and both distribution paths
        env:
          PYTHONPATH: ""
        run: |
          /tmp/nexus-wheel-contract/bin/python -m pytest -q \
            tests/integration/test_runtime_contracts.py \
            tests/unit/test_media_result.py \
            tests/unit/test_wheel_install.py \
            --junitxml=ci-artifacts/wheel-contract.xml
      - name: Retain contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-contract-${{ github.sha }}-py${{ matrix.python }}
          path: ci-artifacts/wheel-contract.xml
          if-no-files-found: warn
