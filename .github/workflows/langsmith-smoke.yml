name: LangSmith tracing smoke

# Proves the configured tracing key can accept a real trace (task-274).  This
# replaces the orphan `langsmith-connectivity-smoke-20261026.yml` registration
# whose branch was deleted, leaving a workflow with no source file.  The job
# fails *visible*: a missing secret is RESULT=SKIPPED_NO_SECRET (exit 0), a
# refused key is RESULT=FAILED (non-zero).  It never reports a false pass.

on:
  workflow_dispatch:
  push:
    paths:
      - "src/nexus_ai_agent/observability/tracing.py"
      - "scripts/langsmith_smoke.py"
      - ".github/workflows/langsmith-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: langsmith-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the tracing extra
        run: pip install -e ".[tracing]"
      - name: Create and verify a synthetic trace
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: nexus-ai-agent-smoke
        run: python scripts/langsmith_smoke.py
