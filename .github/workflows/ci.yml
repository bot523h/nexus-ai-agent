name: CI

# Every push/PR reconciles the coordination board against git + open PRs
# (blocking `board-reconcile` gate, task-163 / ADR 0005). The schedule sweep
# is the 15-minute "truth must not drift" check: even with no pushes, the
# board on main is re-verified against the live PR matrix every 15 minutes.
on:
  push:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  lint:
    name: lint (ruff + mypy + version lockstep)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Version-lockstep guard: VERSION == pyproject.toml == latest CHANGELOG
      # heading.  Fails fast with a human-readable message; the same check
      # also lives in tests/unit/test_version_command.py so ``make test``
      # alone catches drift locally.
      - run: pytest -q tests/unit/test_version_command.py -k lockstep

  test:
    name: test (pytest -m "not slow")
    runs-on: ubuntu-latest
    # task-113: deliberately NOT `needs: lint`.  A broken-lint push must never be able to
    # turn the test suite red, and the `lint-fast` rail below already reports lint and
    # version drift in seconds.  tests/unit/test_ci_lint_parity.py enforces this.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          set -o pipefail
          pytest -v -m "not slow" --tb=short 2>&1 | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 2

  # Prove the initial Alembic chain on real PostgreSQL.
  # real PostgreSQL before any Neon URL is provided.  Zero cloud credentials:
  # a local service container plays the part of Neon.  When NEXUS_DATABASE_URL
  # is later set to Neon, the exact same `nexus migrate` path runs against it.
  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: nexus migrate
      - run: pytest -q tests/integration/test_postgres_create_all_race.py
      # Shared read-only adapter contract, PG leg (incl. golden stability
      # and the f4a9c2e71b08 lifecycle table).
      - run: pytest -q tests/integration/test_checkpoint_adapter_contract.py
      # Lifecycle store contract, PG leg (option A).
      - run: pytest -q tests/integration/test_lifecycle_store_contract.py
      # idempotent re-run must be a no-op (revision already at head).
      - run: nexus migrate
      # Confirm the migration stamp on a real Postgres.
      # Head is a41c9e2b7f63 (stateful_scale_zero, task-163), which revises
      # the 7c2f9d41e8a3 ai_memory_consent revision. The revision is
      # PostgreSQL-only (nexus_presence + nexus_job_queue_pg); the two
      # integration tests below prove both tables work on real PostgreSQL.
      - run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d nexus -tAc "SELECT version_num FROM alembic_version" | grep -q a41c9e2b7f63
      # Scale-to-zero state tiers on real PostgreSQL: presence (server-clock
      # TTLs) and the job queue (SKIP LOCKED claims + stale-steal).
      - run: pytest -q tests/integration/test_presence_pg.py tests/integration/test_job_queue_pg.py

  # ── Distributed state (task-163) ──────────────────────────────────────────
  # The real-Redis leg of the scale-to-zero kill proof: two processes, one
  # SIGKILL between them, the rate-limit count must survive. Zero cloud
  # credentials — a local Redis service container plays the part of the
  # production Redis (same convention as the Postgres service above).
  distributed-state:
    name: distributed-state (Redis scale-to-zero kill proof)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        env:
          REDIS_DISABLE_METRICS: 1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_REDIS_URL: redis://localhost:6379/0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v -m integration tests/integration/test_rate_limiter_redis.py

  # ── Fast rail (task-113) ────────────────────────────────────────────────────
  # Deliberately independent (`needs:` nothing) and dependency-free: it installs no
  # package, so a broken-lint push is reported in seconds instead of after
  # `pip install -e ".[dev]"` — and because the `test` job no longer needs `lint`, a
  # lint failure can never red the test signal either.
  #
  # It carries the residue of task-111 (R1): the lock-step check for
  # VERSION == pyproject.toml == newest released CHANGELOG heading runs *before* any
  # install, so drift fails here first.  The ruff version is pinned and must equal the
  # `rev:` of .pre-commit-config.yaml — tests/unit/test_ci_lint_parity.py fails if the
  # two ever disagree (ruff format output changes between minors, so a split pin means
  # "green locally, red in CI").
  lint-fast:
    name: lint-fast (lockstep + pinned ruff, no install)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_version_lockstep.py
      - run: python -m pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .

  # ── Board truth (task-163 / ADR 0005) ──────────────────────────────────────
  # The blocking board↔git reconciliation gate: .agents/board.json is a cache,
  # git + the open PR matrix is the truth.  Every push/PR re-verifies merged
  # PRs' leases, branch liveness, PR file-fence coverage, and invisible-file
  # detection; a blocking mismatch fails the build (rc=1).  The 15-minute
  # schedule above re-runs this on main even with no pushes, so the board
  # cannot drift silently between pushes.
  #
  # Stdlib-only by design: no `pip install` — just Python, git, and the `gh`
  # CLI (preinstalled on ubuntu-latest, authenticated with the default
  # workflow token for read-only PR queries).
  board-reconcile:
    name: board-reconcile (board.json ↔ git/PR truth gate)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/board_reconcile.py --check
