name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q -m "not slow"

  # Leviathan: prove the Alembic chain (initial_schema → pgvector) works on a
  # real PostgreSQL before any Neon URL is provided.  Zero cloud credentials:
  # a local service container plays the part of Neon.  When NEXUS_DATABASE_URL
  # is later set to Neon, the exact same `nexus migrate` path runs against it.
  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - run: nexus migrate
      # idempotent re-run must be a no-op (revision already at head).
      - run: nexus migrate
      # Chain head is the pgvector revision, and psql confirms both the
      # alembic stamp and the extension's existence on a real Postgres.
      - run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d nexus -tAc "SELECT version_num FROM alembic_version" | grep -q 2a1c4b6d8e9f
      - run: PGPASSWORD=nexus psql -h localhost -U nexus -d nexus -tAc "SELECT count(*) FROM pg_extension WHERE extname = 'vector'" | grep -q 1
