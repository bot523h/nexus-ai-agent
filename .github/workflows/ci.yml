name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A superseded push's matrix run is wasted minutes: cancel it so the queue
# always reflects the newest SHA (the maintenance workflow deliberately does
# NOT do this — scheduled backup runs must never be cancelled).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + mypy + version lockstep)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      # Version-lockstep guard: VERSION == pyproject.toml == latest CHANGELOG
      # heading.  Fails fast with a human-readable message; the same check
      # also lives in tests/unit/test_version_command.py so ``make test``
      # alone catches drift locally.
      - run: pytest -q tests/unit/test_version_command.py -k lockstep

  test:
    name: test (pytest -m "not slow")
    runs-on: ubuntu-latest
    # task-113: deliberately NOT `needs: lint`.  A broken-lint push must never be able to
    # turn the test suite red, and the `lint-fast` rail below already reports lint and
    # version drift in seconds.  tests/unit/test_ci_lint_parity.py enforces this.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: |
          set -o pipefail
          # -rs: skip REASONS are part of the contract — an optional-dependency
          # skip must be intentional and visible, never silent (task-132).
          pytest -v -rs -m "not slow" --tb=short 2>&1 | tee pytest.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 2

  # ── task-132: optional-extras install matrix ────────────────────────────────
  # Every shipping extra of pyproject.toml gets one blocking leg that proves the
  # REAL install path (`pip install -e '.[extra]'`) resolves and its modules
  # import, plus the focused behavioural contract.  The `core` leg proves the
  # core-only contract: no extras, CLI + full import tree, fail-closed guards.
  # scripts/extras_matrix.py check (below) fails when a leg and pyproject drift
  # apart, so a new extra without a leg is a red build, not a silent gap.
  # NO continue-on-error: a failed install is a failed CI run.
  extras-matrix:
    name: extras-matrix (${{ matrix.leg }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXUS_EXTRA_LEG: ${{ matrix.leg }}
    strategy:
      # one red leg must not cancel the others before their evidence exists
      fail-fast: false
      matrix:
        include:
          - leg: core
          - leg: pdf
          - leg: speech
          - leg: translate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install the leg environment
        run: |
          set -eux
          if [ "${{ matrix.leg }}" = "core" ]; then
            # NOT the dev extra: it ships pypdf + imageio-ffmpeg, which would
            # contaminate the core-only absence proof.  Test tooling only.
            pip install -e . pytest pytest-asyncio
          else
            pip install -e ".[${{ matrix.leg }}]" pytest pytest-asyncio
          fi
      - name: Extras-matrix declarations agree (pyproject ↔ CI ↔ tests ↔ committed doc)
        run: python scripts/extras_matrix.py check
      - name: Leg smoke + contract tests
        run: |
          set -o pipefail
          pytest -v -rs tests/unit/test_optional_extras.py --tb=short 2>&1 | tee leg.log
      - name: Focused tests for this leg
        run: |
          set -o pipefail
          case "${{ matrix.leg }}" in
            pdf)
              pytest -q -rs tests/unit/test_jobs_cli.py -k pdf --tb=short 2>&1 | tee -a leg.log
              pytest -q -rs tests/integration/test_in_process_job_queue.py -k pdf --tb=short 2>&1 | tee -a leg.log
              ;;
            speech|translate)
              pytest -q -rs tests/unit/test_caption_engine_adapters.py --tb=short 2>&1 | tee -a leg.log
              ;;
            core)
              # startup contract on the bare install: the CLI composition root
              # must build without any optional package present.
              python -m nexus_ai_agent.cli --help >/dev/null
              ;;
          esac
      - name: Skip-inflation guard (a skippable test on this leg is a defect)
        run: python scripts/extras_matrix.py audit-skips --leg "${{ matrix.leg }}" --log leg.log
      - name: Provenance report (SHA-bound, never "latest")
        run: |
          mkdir -p ci-artifacts
          pip freeze > ci-artifacts/freeze-${{ matrix.leg }}.txt
          python scripts/extras_matrix.py report \
            --out "ci-artifacts/dependency-matrix-${{ matrix.leg }}.json" \
            --sha "$GITHUB_SHA" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --installed-from "ci-artifacts/freeze-${{ matrix.leg }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-matrix-${{ matrix.leg }}
          path: ci-artifacts/
          retention-days: 14

  # ── Python parity (task-132 / CI parity audit) ──────────────────────────────
  # requires-python claims >= 3.10 but every job ran 3.12 only: a local green on
  # 3.11 proved nothing about the declared floor.  This matrix runs the exact
  # test-job selection on every supported minor.  scripts/extras_matrix.py check
  # fails when a job pins a python-version this matrix does not cover.
  #
  # Every leg is blocking: the runtime is 3.10-clean (the former 3.11+ string-enum
  # spellings in domain/glossary.py and domain/policies/retention.py were
  # rewritten with the version-independent recipe, and the TOML touchpoints no
  # longer assume tomllib-or-tomli).  The guard below pins this state from both
  # sides: reintroducing a >3.10 construct fails the suite, and re-adding any
  # soft-failure exception for a leg fails it too.
  # tests/unit/test_ci_extras_parity.py::test_the_310_parity_leg_is_blocking_iff_the_runtime_supports_it
  python-parity:
    name: python-parity (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: |
          set -o pipefail
          pytest -q -rs -m "not slow" --tb=short 2>&1 | tee parity.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: parity-log-${{ matrix.python-version }}
          path: parity.log
          retention-days: 7

  # ── Continuum evidence (DECISION_LOG D-0023) ───────────────────────────────
  # The acceptance contract of the Continuum evidence foundation, on every
  # supported minor (coverage line tables differ per interpreter):
  #   1. the canonical pack-coverage run must be ACCEPTED (every pack >= 95%,
  #      complete target set, clean commit), twice with byte-identical output,
  #      and the artifact must reproduce through --verify-artifact and be bound
  #      to this exact SHA;
  #   2. the snapshot verifier must accept a snapshot published for this SHA
  #      and reject every attack of the threat model (scripts/continuum_gate.py);
  #   3. every catalogued mutation must be killed and restored byte for byte
  #      (scripts/continuum_mutations.py).
  # Steps 2 and 3 also run twice and must be byte-identical; SHA256SUMS of every
  # artifact is part of the upload.
  # Blocking: no soft-fail flag anywhere; fail-fast off so every leg reports.  The
  # artifact directory starts empty and every artifact name carries the SHA and
  # interpreter, so a stale or foreign artifact can never be uploaded as this
  # run's evidence.  The committed .nexus/continuum.json is reported inside the
  # gate artifact (blocking: false) — it is a machine-bound release-cut record.
  continuum-evidence:
    name: continuum-evidence (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # full history: snapshot ancestry and the shallow-clone attack need it
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Evidence is for the commit under test
        run: |
          echo "HEAD=$(git rev-parse HEAD) GITHUB_SHA=$GITHUB_SHA event=$GITHUB_EVENT_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          rm -rf ci-artifacts && mkdir ci-artifacts
      - name: Pack coverage — 95% per-pack contract, deterministic, SHA-bound
        run: |
          python scripts/pack_coverage.py --json-out ci-artifacts/pack-coverage.json
          python scripts/pack_coverage.py --quiet --json-out ci-artifacts/pack-coverage.rerun.json
          cmp ci-artifacts/pack-coverage.json ci-artifacts/pack-coverage.rerun.json
          python scripts/pack_coverage.py --verify-artifact ci-artifacts/pack-coverage.json
          python -c "import json, os, sys; d = json.load(open('ci-artifacts/pack-coverage.json')); ok = d['accepted'] is True and d['provenance']['git_commit'] == os.environ['GITHUB_SHA']; print('artifact bound to', d['provenance']['git_commit'], 'accepted', d['accepted']); sys.exit(0 if ok else 1)"
      - name: Snapshot verifier — publish for this SHA, then every attack (twice, byte-identical)
        run: |
          python scripts/continuum_gate.py --out ci-artifacts/continuum-gate.json
          python scripts/continuum_gate.py --out ci-artifacts/continuum-gate.rerun.json
          cmp ci-artifacts/continuum-gate.json ci-artifacts/continuum-gate.rerun.json
      - name: Mutation campaign — every mutation killed and restored (twice, byte-identical)
        run: |
          python scripts/continuum_mutations.py --out ci-artifacts/continuum-mutations.json
          python scripts/continuum_mutations.py --out ci-artifacts/continuum-mutations.rerun.json
          cmp ci-artifacts/continuum-mutations.json ci-artifacts/continuum-mutations.rerun.json
      - name: Evidence checksums
        run: |
          cd ci-artifacts
          sha256sum *.json > SHA256SUMS
          cat SHA256SUMS
      - name: Evidence digest as check-run annotations (readable without artifact download)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          art = Path("ci-artifacts")
          leg = f"py{os.environ['MATRIX_PYTHON']} @ {os.environ['GITHUB_SHA']}"
          sums = art / "SHA256SUMS"
          if sums.is_file():
              digests = " | ".join(sums.read_text().splitlines())
              print(f"::notice title=continuum sha256 {leg}::{digests}")
          cov = art / "pack-coverage.json"
          if cov.is_file():
              d = json.loads(cov.read_text())
              packs = " ".join(f"{p['pack']}={p['percent']}" for p in d["packs"])
              print(f"::notice title=continuum coverage {leg}::accepted={d['accepted']} commit={d['provenance']['git_commit']} total={d['total']['percent']} {packs}")
          gate = art / "continuum-gate.json"
          if gate.is_file():
              d = json.loads(gate.read_text())
              print(f"::notice title=continuum gate {leg}::passed={d['passed']} source={d['source_commit']} scenarios={len(d['scenarios'])} committed_snapshot={d['committed_snapshot'].get('status')}")
          mut = art / "continuum-mutations.json"
          if mut.is_file():
              d = json.loads(mut.read_text())
              rows = " ".join(f"{r['id']}={r['status']}" for r in d["mutations"])
              print(f"::notice title=continuum mutations {leg}::passed={d['passed']} commit={d['commit']} interpreter={d['interpreter']} summary={d['summary']}")
              print(f"::notice title=continuum mutation records {leg}::{rows}")
          PY
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: continuum-evidence-${{ github.sha }}-py${{ matrix.python-version }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30

  # Canonical foundation proof: this job exercises the declared Ubuntu/Python baseline
  # independently of the hosted runner image used by the other jobs.
  runtime-foundation:
    name: runtime-foundation (Ubuntu 26.04 / Python 3.14)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install canonical system substrate
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3.14 python3.14-venv python3-pip ffmpeg
          ln -sf /usr/bin/python3.14 /usr/local/bin/python
          python -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
      - name: Verify runtime contract
        run: python scripts/check_runtime.py
      - name: Install and import Nexus
        run: |
          /opt/venv/bin/python -m pip install --no-cache-dir -e .
          /opt/venv/bin/python -c "import nexus_ai_agent; print('Nexus import OK')"
          /opt/venv/bin/python -m nexus_ai_agent.cli --help >/dev/null
      - name: Health surface smoke
        run: |
          /opt/venv/bin/python -m pip install --no-cache-dir uvicorn
          (/opt/venv/bin/python -m uvicorn nexus_ai_agent.api.app:app --host 127.0.0.1 --port 8000 >/tmp/nexus-health.log 2>&1 & echo $! >/tmp/nexus-health.pid)
          for attempt in $(seq 1 30); do
            /opt/venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=1)" && break
            sleep 1
          done
          /opt/venv/bin/python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz'); assert r.status == 200; print(r.read().decode())"
          kill "$(cat /tmp/nexus-health.pid)"

  # A trust guard that has never been attacked is not evidence: mutate the
  # pack trust boundary twelve ways and require the suite to go red each time
  # (scripts/pack_trust_mutations.py restores every file it touches).
  trust-mutations:
    name: trust-mutations (pack trust plane)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python scripts/pack_trust_mutations.py
      - name: the working tree must be unchanged after mutation testing
        run: git diff --exit-code

  # Same evidence rule for the temporal authority (MODULE_MAP law R15).  The
  # invariants are pinned by tests/unit/test_temporal_exactness.py,
  # test_temporal_algebra.py and the NTSC-loss export test, and re-attacked here:
  # all ten mutants must die (scripts/temporal_mutations.py restores every file).
  temporal-mutations:
    name: temporal-mutations (temporal truth algebra)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python scripts/temporal_mutations.py
      - name: the working tree must be unchanged after mutation testing
        run: git diff --exit-code

  # The remote-key ingress is a security boundary: an external filename becomes
  # a provider object key and then a cache path.  Three mutations (raw filename
  # as key, unsafe join, encoded traversal unchecked) must each turn the
  # dedicated tests red (scripts/security_mutation_support.py restores bytes).
  remote-key-mutations:
    name: remote-key-mutations (ingress + cache containment)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: python scripts/security_mutations_remote_key.py
      - name: the working tree must be unchanged after mutation testing
        run: git diff --exit-code

  # Prove the initial Alembic chain on real PostgreSQL.
  # real PostgreSQL before any Neon URL is provided.  Zero cloud credentials:
  # a local service container plays the part of Neon.  When NEXUS_DATABASE_URL
  # is later set to Neon, the exact same `nexus migrate` path runs against it.
  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: nexus migrate
      - run: pytest -q tests/integration/test_postgres_create_all_race.py
      # Shared read-only adapter contract, PG leg (incl. golden stability
      # and the f4a9c2e71b08 lifecycle table).
      - run: pytest -q tests/integration/test_checkpoint_adapter_contract.py
      # Lifecycle store contract, PG leg (option A).
      - run: pytest -q tests/integration/test_lifecycle_store_contract.py
      # idempotent re-run must be a no-op (revision already at head).
      - run: nexus migrate
      # Confirm the migration stamp on a real Postgres.
      # Head is 7c2f9d41e8a3 (ai_memory_consent, P0-7), which revises the
      # f4a9c2e71b08 lifecycle table revision.
      - run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d nexus -tAc "SELECT version_num FROM alembic_version" | grep -q 7c2f9d41e8a3

  # ── Merge-base guard (incident #143, fail-closed) ───────────────────────────
  # PR #143 was merged with base = a *feature* branch, not `main`; GitHub called
  # it MERGEABLE because the merge was valid against its own wrong base.  This
  # job makes `base == main` a mechanical precondition: on a `pull_request` event
  # a non-main base is a red build.  On non-PR events it is a no-op pass.
  # scripts/merge_base_guard.py is stdlib-only (no install needed).
  merge-base-guard:
    name: merge-base-guard (base == main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: A main-bound merge requires base == main
        run: |
          python scripts/merge_base_guard.py check-event \
            --event "${{ github.event_name }}" \
            --base "${{ github.base_ref }}"

  # ── Release lineage (machine-checked, reported — never assumed) ─────────────
  # VERSION → commit → CI → tag → GitHub Release → CHANGELOG.  Gaps are OPEN
  # (printed, summarized, artifacted); contradictions are RED: once the current
  # version's tag exists, the whole chain behind it must hold.
  release-lineage:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # full history + tags: lineage is checked against real refs
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Version lockstep + tag/release lineage
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          python scripts/release_lineage.py \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --out ci-artifacts/release-lineage.json \
            --sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-lineage
          path: ci-artifacts/
          retention-days: 30

  # ── Fast rail (task-113) ────────────────────────────────────────────────────
  # Deliberately independent (`needs:` nothing) and dependency-free: it installs no
  # package, so a broken-lint push is reported in seconds instead of after
  # `pip install -e ".[dev]"` — and because the `test` job no longer needs `lint`, a
  # lint failure can never red the test signal either.
  #
  # It carries the residue of task-111 (R1): the lock-step check for
  # VERSION == pyproject.toml == newest released CHANGELOG heading runs *before* any
  # install, so drift fails here first.  The ruff version is pinned and must equal the
  # `rev:` of .pre-commit-config.yaml — tests/unit/test_ci_lint_parity.py fails if the
  # two ever disagree (ruff format output changes between minors, so a split pin means
  # "green locally, red in CI").
  lint-fast:
    name: lint-fast (lockstep + pinned ruff, no install)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python scripts/check_version_lockstep.py
