name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # task-107: uv (free, Rust-based) replaces pip. The elapsed time is printed
      # to the job summary so the speedup stays auditable in the CI log.
      # NOTE: `.[dev]` deliberately excludes every heavy extra (no torch /
      # ChromaDB / llama.cpp), so this job is also the proof that the test suite
      # passes on a core-only install.
      - name: Install dependencies with uv
        run: |
          start=$(date +%s%N)
          uv pip install --system -e ".[dev]"
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "uv install (core + dev): ${ms} ms" | tee "$GITHUB_STEP_SUMMARY"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q -m "not slow"

  # Prove the initial Alembic chain on real PostgreSQL.
  # real PostgreSQL before any Neon URL is provided.  Zero cloud credentials:
  # a local service container plays the part of Neon.  When NEXUS_DATABASE_URL
  # is later set to Neon, the exact same `nexus migrate` path runs against it.
  migrate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # The Postgres driver is the optional [postgres] extra since task-107.
      - name: Install dependencies with uv
        run: |
          start=$(date +%s%N)
          uv pip install --system -e ".[dev,postgres]"
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "uv install (core + dev + postgres): ${ms} ms" | tee "$GITHUB_STEP_SUMMARY"
      - run: nexus migrate
      - run: pytest -q tests/integration/test_postgres_create_all_race.py
      # Shared read-only adapter contract, PG leg (incl. golden stability
      # and the f4a9c2e71b08 lifecycle table).
      - run: pytest -q tests/integration/test_checkpoint_adapter_contract.py
      # Lifecycle store contract, PG leg (option A).
      - run: pytest -q tests/integration/test_lifecycle_store_contract.py
      # idempotent re-run must be a no-op (revision already at head).
      - run: nexus migrate
      # Confirm the migration stamp on a real Postgres.
      - run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d nexus -tAc "SELECT version_num FROM alembic_version" | grep -q f4a9c2e71b08
