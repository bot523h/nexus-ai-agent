# Phase 5 — periodic maintenance only. Deliberately NOT on push/pull_request;
# those gates live in ci.yml. Scheduled workflows only run on the default
# branch and require the repo secrets to be set (docs/ops/r2-storage.md).
name: maintenance

on:
  schedule:
    # Nightly DB backup — 03:17 UTC (deliberately off the top-of-hour).
    - cron: "17 3 * * *"
    # Weekly housekeeping — Mondays 04:23 UTC (also off the top-of-hour).
    - cron: "23 4 * * 1"
    # Weekly restore DRILL — Sundays 05:41 UTC. A backup that has never been
    # restored is a claim; this job keeps the local recovery leg executable.
    - cron: "41 5 * * 0"
  # Allow manual runs from the Actions tab (e.g. right after setting secrets).
  workflow_dispatch: {}

# Read-only repository access is enough; jobs never push.
permissions:
  contents: read

# CPU-only torch + PyPI-only remainder: see scripts/ci_install.sh.

# One shared group: a scheduled backup never overlaps a running one, and a
# manual run queues behind an in-progress schedule instead of cancelling it.
concurrency:
  group: nexus-maintenance
  cancel-in-progress: false

jobs:
  backup-db:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Production pg_dump target. The preflight refuses SQLite and an
      # incomplete blob tier; this job never backs up CI-local state.
      NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
      # Backblaze B2 (preferred maintenance tier). Only these five names.
      NEXUS_B2_KEY_ID: ${{ secrets.NEXUS_B2_KEY_ID }}
      NEXUS_B2_APPLICATION_KEY: ${{ secrets.NEXUS_B2_APPLICATION_KEY }}
      NEXUS_B2_BUCKET: ${{ secrets.NEXUS_B2_BUCKET }}
      NEXUS_B2_ENDPOINT: ${{ secrets.NEXUS_B2_ENDPOINT }}
      NEXUS_B2_REGION: ${{ secrets.NEXUS_B2_REGION }}
      # Cloudflare R2 (legacy fallback tier, kept intact).
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Preflight — required production backup configuration
        run: |
          set -uo pipefail
          missing=()
          if [ -z "${NEXUS_DATABASE_URL:-}" ]; then missing+=("NEXUS_DATABASE_URL"); fi
          # A backup needs ONE complete blob tier. B2 is canonical; R2 stays a
          # valid alternative. A partial set of either is a mistake, so the
          # canonical (B2) names are reported when neither tier is complete.
          b2_names=(NEXUS_B2_KEY_ID NEXUS_B2_APPLICATION_KEY NEXUS_B2_BUCKET NEXUS_B2_ENDPOINT NEXUS_B2_REGION)
          r2_names=(R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET)
          b2_complete=true
          for name in "${b2_names[@]}"; do [ -n "${!name:-}" ] || b2_complete=false; done
          r2_complete=true
          for name in "${r2_names[@]}"; do [ -n "${!name:-}" ] || r2_complete=false; done
          if ! $b2_complete && ! $r2_complete; then
            missing+=("${b2_names[@]}")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=backup-db preflight failed::missing repository secrets: ${missing[*]}"
            echo "Refusing production backup; no artifact was produced or uploaded."
            echo "Configure a complete Backblaze B2 tier (NEXUS_B2_*) using docs/ops/b2-storage.md,"
            echo "or a complete Cloudflare R2 tier (R2_*) using docs/ops/r2-storage.md."
            exit 1
          fi
          case "${NEXUS_DATABASE_URL}" in
            postgres://*|postgresql://*|postgresql+asyncpg://*) ;;
            *)
              echo "::error title=backup-db preflight failed::NEXUS_DATABASE_URL is not a PostgreSQL URL"
              echo "Refusing a CI-local SQLite fallback for the production backup."
              exit 1
              ;;
          esac
          if ! command -v pg_dump >/dev/null 2>&1; then
            echo "::error title=backup-db preflight failed::pg_dump is unavailable"
            exit 1
          fi
          echo "preflight ok — production PostgreSQL + a blob tier (B2 preferred, R2 fallback) is configured"
          echo "See docs/ops/b2-storage.md (B2) or docs/ops/r2-storage.md (R2) for secret ownership and rotation."
      - run: bash scripts/ci_install.sh "."
      # Stateless + idempotent: safe to re-run. Exits non-zero when no blob
      # tier is configured so a silently-skipped backup is visible, not hidden
      # (deliberate design: an unmonitored missing backup is worse than a red
      # job — owner configures the five NEXUS_B2_* secrets once; see
      # docs/ops/b2-storage.md and docs/ops/DISASTER_RECOVERY_RUNBOOK.md).
      # This runs the exact production entry point `create_backup()`. The
      # step writes the machine-verifiable evidence (key, sha256, size,
      # timestamp) to the job log AND the step summary (task-164 AC).
      - name: Nightly DB backup (round-trip + sidecar verified)
        run: |
          set -o pipefail
          nexus maintenance backup 2>&1 | tee backup.log
      # On failure the operator gets the actionable error class AND the full
      # log artifact — never a bare red X.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: backup-db-log
          path: backup.log
          retention-days: 14

  restore-drill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash scripts/ci_install.sh "."
      # The LOCAL drill leg: build a database with the REAL application
      # schema, dump it through the SAME online-backup function the nightly
      # job uses, then restore-drill it into an isolated target and require
      # the app's tables back. No R2 secrets and no fake provider: this
      # proves the artifact→recovery chain end-to-end. The remote leg
      # (--from-r2/--latest) needs owner credentials and stays owner-side
      # (docs/ops/DISASTER_RECOVERY_RUNBOOK.md) — it is never faked here.
      - name: Build a real application-schema backup artifact
        run: |
          mkdir -p drill
          python - <<'EOF'
          import asyncio
          from pathlib import Path
          from nexus_ai_agent.storage.db import create_all_tables
          from nexus_ai_agent.maintenance.backup import _dump_sqlite, _sha256
          asyncio.run(create_all_tables("drill/source.sqlite3"))
          _dump_sqlite(Path("drill/source.sqlite3"), Path("drill/nexus-sqlite-drill.sqlite3"))
          print("DRILL_ARTIFACT_SHA256 " + _sha256(Path("drill/nexus-sqlite-drill.sqlite3")))
          EOF
      - name: Restore-drill the artifact (apply + app-schema proof)
        run: |
          set -o pipefail
          python -m nexus_ai_agent.maintenance.restore \
            --from-local drill/nexus-sqlite-drill.sqlite3 \
            --apply --target drill/restored.sqlite3 --force \
            --expect-app-schema --json 2>&1 | tee drill/drill.json
      - name: Publish drill evidence
        run: |
          python - <<'EOF'
          import json, os
          report = json.load(open("drill/drill.json", encoding="utf-8"))
          assert report["ok"] is True, "restore drill must report ok"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Restore drill (weekly)\n- engine: sqlite (local leg)\n- chain: " +
                       " → ".join(s["state"] for s in report["chain"]) +
                       "\n- ok: " + str(report["ok"]) + "\n")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: restore-drill-report
          path: drill/
          retention-days: 14

  reconcile-artifacts:
    # DB <-> disk reconciliation of published creative artifacts (Wave 3B).
    # Every night, right after the backup window: an orphan published file or a
    # binding whose blob no longer matches is exactly the crash window a backup
    # cannot repair, so it must be *visible* the next morning.
    #
    # The job is a DRY RUN by default: it reports what it would repair and fails
    # the run (`--fail-on-violation`) when a divergence remains. Repair stays an
    # explicit operator action (`--apply-repair`) because relocating bytes and
    # writing lineage rows on production state is a reviewed decision.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '17 3 * * *' ||
      github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same production database the backup job reads; SQLite is refused below.
      NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash scripts/ci_install.sh "."
      - name: Reconciliation preflight — production database configured
        run: |
          set -uo pipefail
          if [ -z "${NEXUS_DATABASE_URL:-}" ]; then
            echo "::error title=reconcile-artifacts::NEXUS_DATABASE_URL is not configured"
            echo "A reconciliation against CI-local state would prove nothing."
            exit 1
          fi
          echo "preflight ok — reconciling against the configured production database"
      - name: Reconcile published artifacts against the durable bindings (dry run)
        run: |
          set -o pipefail
          python -m nexus_ai_agent.maintenance.reconciler \
            --workspace-root . \
            --json \
            --fail-on-violation 2>&1 | tee reconcile.json
      - name: Publish reconciliation evidence
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          path = pathlib.Path("reconcile.json")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if not path.is_file() or summary is None:
              raise SystemExit(0)
          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)  # the step log already carries the failure
          lines = [
              "## Artifact reconciliation (nightly, dry run)",
              f"- scanned files: {report.get('scanned_files')}",
              f"- bindings checked: {report.get('bindings_checked')}",
              f"- violations: {report.get('violations')}",
              f"- would repair: {sum(1 for i in report.get('issues', []) if i.get('action') == 'would_repair')}",
              f"- would quarantine: {sum(1 for i in report.get('issues', []) if i.get('action') == 'would_quarantine')}",
          ]
          with open(summary, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reconciliation-report
          path: reconcile.json
          retention-days: 14

  housekeeping:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Housekeeping needs no database access — blob-tier secrets only.
      # No bot token here on purpose. B2 is preferred; R2 stays a fallback.
      NEXUS_B2_KEY_ID: ${{ secrets.NEXUS_B2_KEY_ID }}
      NEXUS_B2_APPLICATION_KEY: ${{ secrets.NEXUS_B2_APPLICATION_KEY }}
      NEXUS_B2_BUCKET: ${{ secrets.NEXUS_B2_BUCKET }}
      NEXUS_B2_ENDPOINT: ${{ secrets.NEXUS_B2_ENDPOINT }}
      NEXUS_B2_REGION: ${{ secrets.NEXUS_B2_REGION }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: bash scripts/ci_install.sh "."
      # Idempotent: a second run finds nothing to do. Stays green when no blob
      # tier is configured (local temp cleanup only).
      - run: nexus maintenance housekeeping
