# Phase 5 — periodic maintenance only. Deliberately NOT on push/pull_request;
# those gates live in ci.yml. Scheduled workflows only run on the default
# branch and require the repo secrets to be set (docs/ops/r2-storage.md).
name: maintenance

on:
  schedule:
    # Nightly DB backup — 03:17 UTC (deliberately off the top-of-hour).
    - cron: "17 3 * * *"
    # Weekly housekeeping — Mondays 04:23 UTC (also off the top-of-hour).
    - cron: "23 4 * * 1"
  # Allow manual runs from the Actions tab (e.g. right after setting secrets).
  workflow_dispatch: {}
  # TEMPORARY (task-164 forensics only — removed before merge): the sandbox
  # token cannot dispatch workflows, so the diagnostic runs on push of this branch.
  push:
    branches: ["arena/01a0d9f4-nexus-ai-agent"]

# One shared group: a scheduled backup never overlaps a running one, and a
# manual run queues behind an in-progress schedule instead of cancelling it.
concurrency:
  group: nexus-maintenance
  cancel-in-progress: false

jobs:
  backup-db:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    env:
      # pg_dump target. When unset, the command backs up the local SQLite
      # file instead (which is empty in CI) — set the secret for real use.
      NEXUS_DATABASE_URL: ${{ secrets.NEXUS_DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # task-164 forensics: presence booleans only — secret VALUES are never
      # printed. Each finding is mirrored as its own step below so the
      # configuration state is readable from the jobs API even when the log
      # archive is unreachable.
      - name: Preflight (presence booleans only)
        id: preflight
        run: |
          have() { if [ -n "${!1:-}" ]; then echo true; else echo false; fi; }
          {
            echo "r2_account_id=$(have R2_ACCOUNT_ID)"
            echo "r2_access_key_id=$(have R2_ACCESS_KEY_ID)"
            echo "r2_secret_access_key=$(have R2_SECRET_ACCESS_KEY)"
            echo "r2_bucket=$(have R2_BUCKET)"
            echo "database_url=$(have NEXUS_DATABASE_URL)"
            if command -v pg_dump >/dev/null; then echo "pg_dump=true"; else echo "pg_dump=false"; fi
          } | tee -a "$GITHUB_OUTPUT"
          pg_dump --version || true
          if [ -n "${NEXUS_DATABASE_URL:-}" ] && command -v psql >/dev/null; then
            # server major only (not a secret); 20 s cap so a hung TCP connect cannot stall the job
            timeout 20 psql "$NEXUS_DATABASE_URL" -Atc "show server_version" 2>&1 | sed 's/^/server_version: /' || true
          fi
      - name: "Config: R2_ACCOUNT_ID present"
        if: steps.preflight.outputs.r2_account_id == 'true'
        run: "true"
      - name: "Config: R2_ACCESS_KEY_ID present"
        if: steps.preflight.outputs.r2_access_key_id == 'true'
        run: "true"
      - name: "Config: R2_SECRET_ACCESS_KEY present"
        if: steps.preflight.outputs.r2_secret_access_key == 'true'
        run: "true"
      - name: "Config: R2_BUCKET present"
        if: steps.preflight.outputs.r2_bucket == 'true'
        run: "true"
      - name: "Config: NEXUS_DATABASE_URL present"
        if: steps.preflight.outputs.database_url == 'true'
        run: "true"
      - name: "Config: pg_dump on PATH"
        if: steps.preflight.outputs.pg_dump == 'true'
        run: "true"
      # Stateless + idempotent: safe to re-run. Exits non-zero when R2 is
      # not configured so a silently-skipped backup is visible, not hidden.
      - run: nexus maintenance backup

  housekeeping:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 4 * * 1'
    runs-on: ubuntu-latest
    env:
      # Housekeeping needs no database access — R2 secrets only.
      # No bot token here on purpose.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Idempotent: a second run finds nothing to do. Stays green when R2
      # is not configured (local temp cleanup only).
      - run: nexus maintenance housekeeping
